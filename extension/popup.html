<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workflow Detective</title>
<link rel="stylesheet" href="ui.css">
<style>
  body{width:330px}
  .pop{padding:16px;display:flex;flex-direction:column;gap:14px}
  .stat{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
  .stack{display:flex;flex-direction:column;gap:8px}
  .stack .btn{width:100%;text-align:left}
  .site{font-family:var(--mono);font-size:12px}
.access{display:flex;flex-direction:column;gap:8px;background:var(--bad-bg);color:var(--ink);border-radius:8px;padding:10px 12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="pop">
  <div class="row" style="justify-content:space-between">
    <div class="brand"><img src="icons/48.png" alt="">Workflow Detective</div>
  </div>
  <div class="stack">
    <span id="pill" class="pill">Loading…</span>
    <p id="sub" class="small muted"></p>
  </div>
  <div class="stat"><span class="muted">Actions logged today</span><b id="today" class="tnum">0</b></div>
  <div class="stat"><span class="muted">Watch days finished</span><b id="days" class="tnum">0 of 0</b></div>
  <div class="access" id="access" hidden>
    <p class="small"><b>Website access is off.</b> Workflow Detective can’t notice your work in websites until you allow it.</p>
    <button class="btn primary" id="allow">Allow website access</button>
  </div>
  <div class="stack" id="actions">
    <button class="btn primary" id="report">Open my findings</button>
    <button class="btn" id="pause">Pause for 1 hour</button>
    <button class="btn" id="block">Never watch <span class="site" id="host"></span></button>
    <p class="small muted" id="blockNote" hidden></p>
    <button class="btn" id="settings">Settings and privacy</button>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
